<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校內實驗室預約系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <style>
    /* 全局覆蓋 FullCalendar 樣式：解決文字看不到與空間擠壓問題 */
    .fc-daygrid-event-harness {
      margin-bottom: 3px !important;
    }
    
    /* 強制事件顯示為高對比度色塊 */
    .fc-event {
      border: none !important;
      border-radius: 4px !important;
      padding: 2px 4px !important;
      cursor: pointer;
    }

    /* 允許文字自動換行與斷字 */
    .fc-event-main {
      white-space: normal !important;
      word-break: break-word !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      font-size: 0.825rem !important;
      line-height: 1.3 !important;
      padding: 2px !important;
    }

    /* 徹底關閉圓點與預設 12am 時間標籤 */
    .fc-daygrid-event-dot,
    .fc-event-time {
      display: none !important;
    }

    /* 增加日曆格子基礎高度 */
    .fc-daygrid-day-frame {
      min-height: 100px !important;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        🧪 校內實驗室預約系統
      </h1>
      <div class="flex items-center gap-3">
        <div class="bg-indigo-800 p-1 rounded-xl flex gap-1">
          <button id="tab-ryan" onclick="switchAdmin('Ryan')" class="px-4 py-2 rounded-lg font-medium transition bg-white text-indigo-700 shadow">Ryan 管理實驗室</button>
          <button id="tab-wilson" onclick="switchAdmin('Wilson')" class="px-4 py-2 rounded-lg font-medium transition text-white hover:bg-indigo-600">Wilson 管理實驗室</button>
        </div>
        <button onclick="openAdminModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center gap-1">
          🔐 <span id="btn-admin-name">Ryan</span> 管理員登入審核
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6">
    
    <!-- 左側：申請預約表單 -->
    <div class="lg:col-span-1">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 sticky top-6">
        <h2 class="text-base font-bold mb-3 text-slate-700 flex items-center gap-2 border-b pb-2">
          📝 提交預約申請 (<span id="current-admin-label" class="text-indigo-600">Ryan</span>)
        </h2>
        <form id="booking-form" onsubmit="submitBooking(event)" class="space-y-3 text-sm">
          <div>
            <label class="block font-semibold mb-1 text-slate-600">教師姓名</label>
            <input type="text" id="teacherName" placeholder="請輸入姓名" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">班別</label>
            <input type="text" id="className" placeholder="例如：3A" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">預約日期</label>
            <input type="date" id="date" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">時段 / 節數</label>
            <input type="text" id="timeSlot" placeholder="例如：第3-4節" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">實驗題目</label>
            <textarea id="topic" rows="3" placeholder="請填寫實驗項目與名稱" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition shadow-sm">
            送出預約申請
          </button>
        </form>
      </div>
    </div>

    <!-- 右側：可視化行事曆 -->
    <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-4 border-b pb-3">
          <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
            📅 預約日程表 (<span id="calendar-admin-label">Ryan</span>)
          </h2>
          <div class="flex gap-4 text-xs font-medium">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block shadow-sm"></span> 待審核 (Pending)</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-600 inline-block shadow-sm"></span> 已確認 (Approved)</span>
          </div>
        </div>
        <div id="calendar" class="min-h-[650px]"></div>
      </div>
    </div>

  </main>

  <!-- 管理員密碼與審核/刪除 Modal -->
  <div id="admin-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-xl overflow-hidden flex flex-col max-h-[85vh]">
      
      <div class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="font-bold text-lg flex items-center gap-2">
          🔐 <span id="modal-admin-label">Ryan</span> 管理員後台
        </h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <div class="p-6 space-y-4 overflow-y-auto flex-grow">
        <!-- 密碼輸入驗證區 -->
        <div id="auth-section" class="space-y-3">
          <p class="text-sm text-slate-600">請輸入 <strong id="modal-pass-admin-name" class="text-indigo-600">Ryan</strong> 的專用管理員密碼：</p>
          <div class="flex gap-2">
            <input type="password" id="admin-pass" placeholder="輸入專屬密碼" class="px-3 py-2 border rounded-lg text-sm w-full focus:ring-2 focus:ring-slate-500 outline-none">
            <button onclick="verifyAndLoadList()" class="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-700 transition font-medium whitespace-nowrap">
              驗證登入
            </button>
          </div>
        </div>

        <!-- 預約管理區 (驗證成功後顯示) -->
        <div id="management-section" class="hidden space-y-4 pt-2 border-t border-slate-100">
          
          <!-- 分頁：待審核 vs 完整清單（指定刪除單筆） -->
          <div class="flex border-b text-sm font-semibold">
            <button id="tab-btn-pending" onclick="switchManageTab('pending')" class="py-2 px-4 text-indigo-600 border-b-2 border-indigo-600">待審核申請</button>
            <button id="tab-btn-all" onclick="switchManageTab('all')" class="py-2 px-4 text-slate-500 hover:text-slate-700">完整清單（刪除預約）</button>
          </div>

          <div id="manage-list-container" class="space-y-3 max-h-[350px] overflow-y-auto pr-1"></div>
        </div>
      </div>

      <div class="bg-slate-50 px-6 py-3 border-t flex justify-end">
        <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-200 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-300 transition">
          關閉
        </button>
      </div>

    </div>
  </div>

  <script>
    // ⚠️ 請替換為你的 Google Apps Script Web App URL
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    let currentAdmin = "Ryan";
    let calendar;
    let rawBookings = [];
    let authenticatedPassword = "";
    let activeManageTab = "pending";

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'zh-tw',
        height: 'auto',
        displayEventTime: false,
        eventDisplay: 'block', // 設定所有事件為區塊展示模式，不使用點狀樣式
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        events: []
      });
      calendar.render();
      fetchBookings();
    });

    function switchAdmin(admin) {
      currentAdmin = admin;
      document.getElementById('current-admin-label').innerText = admin;
      document.getElementById('calendar-admin-label').innerText = admin;
      document.getElementById('modal-admin-label').innerText = admin;
      document.getElementById('btn-admin-name').innerText = admin;
      document.getElementById('modal-pass-admin-name').innerText = admin;
      
      const tabRyan = document.getElementById('tab-ryan');
      const tabWilson = document.getElementById('tab-wilson');
      
      if (admin === 'Ryan') {
        tabRyan.className = "px-4 py-2 rounded-lg font-medium transition bg-white text-indigo-700 shadow";
        tabWilson.className = "px-4 py-2 rounded-lg font-medium transition text-white hover:bg-indigo-600";
      } else {
        tabWilson.className = "px-4 py-2 rounded-lg font-medium transition bg-white text-indigo-700 shadow";
        tabRyan.className = "px-4 py-2 rounded-lg font-medium transition text-white hover:bg-indigo-600";
      }

      authenticatedPassword = "";
      document.getElementById('management-section').classList.add('hidden');
      document.getElementById('admin-pass').value = "";

      fetchBookings();
    }

    async function fetchBookings() {
      try {
        const res = await fetch(`${API_URL}?action=read&admin=${currentAdmin}`);
        rawBookings = await res.json();
        
        // 渲染至日曆：顯示 [時段] 姓名 (班別)
        const events = rawBookings
          .filter(b => b.Status !== 'rejected')
          .map(b => ({
            title: `[${b.TimeSlot}] ${b.TeacherName} (${b.ClassName})`,
            start: b.Date,
            allDay: true,
            backgroundColor: b.Status === 'approved' ? '#059669' : '#d97706',
            borderColor: b.Status === 'approved' ? '#047857' : '#b45309',
          }));

        calendar.removeAllEvents();
        calendar.addEventSource(events);
      } catch (err) {
        console.error("載入失敗：", err);
      }
    }

    async function submitBooking(e) {
      e.preventDefault();
      const data = {
        action: 'create',
        admin: currentAdmin,
        teacherName: document.getElementById('teacherName').value,
        className: document.getElementById('className').value,
        date: document.getElementById('date').value,
        timeSlot: document.getElementById('timeSlot').value,
        topic: document.getElementById('topic').value
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(result.message);
      document.getElementById('booking-form').reset();
      fetchBookings();
    }

    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    function verifyAndLoadList() {
      const pass = document.getElementById('admin-pass').value;
      if (!pass) return alert("請輸入密碼");

      authenticatedPassword = pass;
      document.getElementById('management-section').classList.remove('hidden');
      renderManageList();
    }

    function switchManageTab(tab) {
      activeManageTab = tab;
      const btnPending = document.getElementById('tab-btn-pending');
      const btnAll = document.getElementById('tab-btn-all');

      if (tab === 'pending') {
        btnPending.className = "py-2 px-4 text-indigo-600 border-b-2 border-indigo-600 font-semibold";
        btnAll.className = "py-2 px-4 text-slate-500 hover:text-slate-700 font-semibold";
      } else {
        btnAll.className = "py-2 px-4 text-indigo-600 border-b-2 border-indigo-600 font-semibold";
        btnPending.className = "py-2 px-4 text-slate-500 hover:text-slate-700 font-semibold";
      }
      renderManageList();
    }

    function renderManageList() {
      const container = document.getElementById('manage-list-container');
      container.innerHTML = "";

      let displayData = [];
      if (activeManageTab === 'pending') {
        displayData = rawBookings.filter(b => b.Status === 'pending');
      } else {
        displayData = rawBookings;
      }

      if (displayData.length === 0) {
        container.innerHTML = `<div class="text-sm text-slate-500 py-4 text-center">沒有符合條件的預約紀錄。</div>`;
        return;
      }

      displayData.forEach(item => {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm space-y-1.5 shadow-sm";
        
        let statusBadge = item.Status === 'approved' 
          ? `<span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">已確認</span>`
          : (item.Status === 'pending' 
            ? `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">待審核</span>`
            : `<span class="text-xs bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-medium">已退回</span>`);

        let actionsHtml = "";
        if (activeManageTab === 'pending') {
          actionsHtml = `
            <button onclick="reviewBooking('${item.ID}', 'approve')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-1.5 rounded-lg transition">核准</button>
            <button onclick="reviewBooking('${item.ID}', 'reject')" class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold py-1.5 rounded-lg transition">退回</button>
            <button onclick="deleteBooking('${item.ID}')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">刪除</button>
          `;
        } else {
          actionsHtml = `
            <button onclick="deleteBooking('${item.ID}')" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold py-1.5 rounded-lg transition flex justify-center items-center gap-1">🗑️ 刪除此預約紀錄</button>
          `;
        }

        div.innerHTML = `
          <div class="flex justify-between items-center font-bold text-slate-700">
            <span>${item.TeacherName} 老師 (${item.ClassName})</span>
            ${statusBadge}
          </div>
          <div class="text-xs text-slate-600">📅 <strong>日期：</strong>${item.Date} | ⏰ <strong>時段：</strong>${item.TimeSlot}</div>
          <div class="text-xs text-slate-600">🧪 <strong>題目：</strong>${item.Topic}</div>
          <div class="flex gap-2 pt-2 border-t border-slate-200/60 mt-1">
            ${actionsHtml}
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function reviewBooking(id, action) {
      if (!authenticatedPassword) return alert("請先完成密碼驗證！");

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: action,
          admin: currentAdmin,
          id: id,
          password: authenticatedPassword
        })
      });
      const result = await res.json();
      alert(result.message);
      
      if (result.status === 'success') {
        await fetchBookings();
        renderManageList();
      }
    }

    async function deleteBooking(id) {
      if (!authenticatedPassword) return alert("請先完成密碼驗證！");
      if (!confirm("確定要刪除這筆預約紀錄嗎？")) return;

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'delete',
          admin: currentAdmin,
          id: id,
          password: authenticatedPassword
        })
      });
      const result = await res.json();
      alert(result.message);
      
      if (result.status === 'success') {
        await fetchBookings();
        renderManageList();
      }
    }
  </script>
</body>
</html>
