<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校內實驗室預約系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <style>
    /* 調整月曆空間與視覺 */
    .fc {
      font-family: inherit;
    }
    .fc-header-toolbar {
      margin-bottom: 1rem !important;
    }
    .fc-event {
      cursor: pointer;
      padding: 2px 4px;
      font-size: 0.85rem;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        🧪 校內實驗室預約系統
      </h1>
      <div class="flex items-center gap-3">
        <div class="bg-indigo-800 p-1 rounded-xl flex gap-1">
          <button id="tab-ryan" onclick="switchAdmin('Ryan')" class="px-4 py-2 rounded-lg font-medium transition bg-white text-indigo-700 shadow">Ryan 管理實驗室</button>
          <button id="tab-wilson" onclick="switchAdmin('Wilson')" class="px-4 py-2 rounded-lg font-medium transition text-white hover:bg-indigo-600">Wilson 管理實驗室</button>
        </div>
        <button onclick="openAdminModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center gap-1">
          🔐 管理員登入審核
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6">
    
    <!-- 左側：申請預約表單 (佔 1 欄) -->
    <div class="lg:col-span-1">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 sticky top-6">
        <h2 class="text-base font-bold mb-3 text-slate-700 flex items-center gap-2 border-b pb-2">
          📝 提交預約申請 (<span id="current-admin-label" class="text-indigo-600">Ryan</span>)
        </h2>
        <form id="booking-form" onsubmit="submitBooking(event)" class="space-y-3 text-sm">
          <div>
            <label class="block font-semibold mb-1 text-slate-600">教師姓名</label>
            <input type="text" id="teacherName" placeholder="請輸入姓名" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">班別</label>
            <input type="text" id="className" placeholder="例如：3A" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">預約日期</label>
            <input type="date" id="date" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">時段 / 節數</label>
            <input type="text" id="timeSlot" placeholder="例如：10:00-11:30 (第3-4節)" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-semibold mb-1 text-slate-600">實驗題目</label>
            <textarea id="topic" rows="3" placeholder="請填寫實驗項目與名稱" required class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition shadow-sm">
            送出預約申請
          </button>
        </form>
      </div>
    </div>

    <!-- 右側：可視化行事曆 (放大空間，佔 3 欄) -->
    <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-4 border-b pb-3">
          <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
            📅 預約日程表 (<span id="calendar-admin-label">Ryan</span>)
          </h2>
          <div class="flex gap-4 text-xs font-medium">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block shadow-sm"></span> 待審核 (Pending)</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block shadow-sm"></span> 已確認 (Approved)</span>
          </div>
        </div>
        <!-- 日程表容器 -->
        <div id="calendar" class="min-h-[650px]"></div>
      </div>
    </div>

  </main>

  <!-- 管理員密碼與審核 Modal (彈出視窗) -->
  <div id="admin-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-lg overflow-hidden flex flex-col max-h-[85vh]">
      
      <!-- Modal 標頭 -->
      <div class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="font-bold text-lg flex items-center gap-2">
          🔐 管理員審核面板 (<span id="modal-admin-label">Ryan</span>)
        </h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <!-- Modal 內容區 -->
      <div class="p-6 space-y-4 overflow-y-auto flex-grow">
        <!-- 密碼輸入驗證區 -->
        <div id="auth-section" class="space-y-3">
          <p class="text-sm text-slate-600">請輸入管理員密碼以進行核准或退回：</p>
          <div class="flex gap-2">
            <input type="password" id="admin-pass" placeholder="管理員密碼" class="px-3 py-2 border rounded-lg text-sm w-full focus:ring-2 focus:ring-slate-500 outline-none">
            <button onclick="verifyAndLoadPending()" class="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-700 transition font-medium whitespace-nowrap">
              驗證登入
            </button>
          </div>
        </div>

        <!-- 審核列表容器 (初始隱藏) -->
        <div id="pending-section" class="hidden space-y-3 pt-2 border-t border-slate-100">
          <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">待審核申請清單</h4>
          <div id="pending-list" class="space-y-3 max-h-[350px] overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- Modal 底部按鈕 -->
      <div class="bg-slate-50 px-6 py-3 border-t flex justify-end">
        <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-200 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-300 transition">
          關閉
        </button>
      </div>

    </div>
  </div>

  <script>
    // ⚠️ 請替換為你的 Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbznYjrsDaRF7SzwKD27QYCW6bF-1gNIa8WgOdguhqf4Gb_cS5zvr0AwDrbOIUnOGJWP/exec";

    let currentAdmin = "Ryan";
    let calendar;
    let rawBookings = [];
    let authenticatedPassword = "";

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'zh-tw',
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        events: []
      });
      calendar.render();
      fetchBookings();
    });

    function switchAdmin(admin) {
      currentAdmin = admin;
      document.getElementById('current-admin-label').innerText = admin;
      document.getElementById('calendar-admin-label').innerText = admin;
      document.getElementById('modal-admin-label').innerText = admin;
      
      const tabRyan = document.getElementById('tab-ryan');
      const tabWilson = document.getElementById('tab-wilson');
      
      if (admin === 'Ryan') {
        tabRyan.className = "px-4 py-2 rounded-lg font-medium transition bg-white text-indigo-700 shadow";
        tabWilson.className = "px-4 py-2 rounded-lg font-medium transition text-white hover:bg-indigo-600";
      } else {
        tabWilson.className = "px-4 py-2 rounded-lg font-medium transition bg-white text-indigo-700 shadow";
        tabRyan.className = "px-4 py-2 rounded-lg font-medium transition text-white hover:bg-indigo-600";
      }

      // 重設 Modal 驗證狀態
      authenticatedPassword = "";
      document.getElementById('pending-section').classList.add('hidden');
      document.getElementById('admin-pass').value = "";

      fetchBookings();
    }

    async function fetchBookings() {
      try {
        const res = await fetch(`${API_URL}?action=read&admin=${currentAdmin}`);
        rawBookings = await res.json();
        
        // 僅顯示 [時間] 預約者名稱，隱藏 ID 與實驗題目細節
        const events = rawBookings
          .filter(b => b.Status !== 'rejected')
          .map(b => ({
            title: `[${b.TimeSlot}] ${b.TeacherName} (${b.ClassName})`,
            start: b.Date,
            backgroundColor: b.Status === 'approved' ? '#10b981' : '#f59e0b',
            borderColor: b.Status === 'approved' ? '#059669' : '#d97706',
          }));

        calendar.removeAllEvents();
        calendar.addEventSource(events);
      } catch (err) {
        console.error("載入失敗：", err);
      }
    }

    async function submitBooking(e) {
      e.preventDefault();
      const data = {
        action: 'create',
        admin: currentAdmin,
        teacherName: document.getElementById('teacherName').value,
        className: document.getElementById('className').value,
        date: document.getElementById('date').value,
        timeSlot: document.getElementById('timeSlot').value,
        topic: document.getElementById('topic').value
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(result.message);
      document.getElementById('booking-form').reset();
      fetchBookings();
    }

    // 開啟管理員 Modal
    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
    }

    // 關閉管理員 Modal
    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    // 驗證密碼並載入待審核清單
    function verifyAndLoadPending() {
      const pass = document.getElementById('admin-pass').value;
      if (!pass) return alert("請輸入密碼");

      authenticatedPassword = pass;
      renderPendingList();
    }

    function renderPendingList() {
      const pending = rawBookings.filter(b => b.Status === 'pending');
      const container = document.getElementById('pending-list');
      container.innerHTML = "";

      if (pending.length === 0) {
        container.innerHTML = `<div class="text-sm text-slate-500 py-4 text-center">目前沒有待審核的預約申請 🎉</div>`;
      } else {
        pending.forEach(item => {
          const div = document.createElement('div');
          div.className = "p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm space-y-1.5 shadow-sm";
          div.innerHTML = `
            <div class="flex justify-between items-center font-bold text-slate-700">
              <span>${item.TeacherName} 老師 (${item.ClassName})</span>
              <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">待審核</span>
            </div>
            <div class="text-xs text-slate-600">📅 <strong>日期：</strong>${item.Date} | ⏰ <strong>時段：</strong>${item.TimeSlot}</div>
            <div class="text-xs text-slate-600">🧪 <strong>題目：</strong>${item.Topic}</div>
            <div class="flex gap-2 pt-2 border-t border-slate-200/60 mt-1">
              <button onclick="reviewBooking('${item.ID}', 'approve')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-1.5 rounded-lg transition">核准預約</button>
              <button onclick="reviewBooking('${item.ID}', 'reject')" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold py-1.5 rounded-lg transition">退回預約</button>
            </div>
          `;
          container.appendChild(div);
        });
      }

      document.getElementById('pending-section').classList.remove('hidden');
    }

    async function reviewBooking(id, action) {
      if (!authenticatedPassword) return alert("請先完成密碼驗證！");

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: action,
          admin: currentAdmin,
          id: id,
          password: authenticatedPassword
        })
      });
      const result = await res.json();
      alert(result.message);
      
      if (result.status === 'success') {
        await fetchBookings();
        renderPendingList(); // 重新整理彈出視窗內的清單
      }
    }
  </script>
</body>
</html>
